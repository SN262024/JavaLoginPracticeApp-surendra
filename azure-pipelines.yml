trigger:
- main

pool:
  name: Default  # Tumhara self-hosted agent pool

variables:
  VM_USER: "surendraadmin"
  TOMCAT_PATH: "/opt/tomcat"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"  # Java 17 path on VM
  
stages:
- stage: Build
  displayName: Build Java Application
  jobs:
  - job: BuildJob
    displayName: Maven Build
    pool:
      name: Default
    steps:

    # 1️⃣ Checkout code
    - checkout: self

    # 2️⃣ Install Java 17 if missing & set JAVA_HOME
    - script: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        java -version
        javac -version
      displayName: Install Java 17 & Set JAVA_HOME

    # 3️⃣ Maven install
    - script: |
        sudo apt install -y maven
        mvn -version
      displayName: Install Maven

    # 4️⃣ Build WAR
    - script: |
        mvn clean package
      displayName: Maven Build

    # 5️⃣ Publish WAR Artifact
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'target'
        artifactName: 'java-war'
        publishLocation: 'Container'
      displayName: Publish WAR Artifact


# =========================
# STAGE 2 : DEPLOY
# =========================
- stage: Deploy
  displayName: Deploy to VM
  dependsOn: Build
  jobs:
  - job: DeployJob
    displayName: Deploy WAR to Tomcat
    steps:

    # 🔹 0️⃣ SSH CONNECTION TEST (VERY IMPORTANT)
    - task: SSH@0
      displayName: Test SSH Connection
      inputs:
        sshEndpoint: 'vm-ssh-connection'
        runOptions: 'inline'
        inline: |
          whoami
          hostname
          ls -la /home/surendraadmin


    # 🔹 1️⃣ Download WAR artifact
    - task: DownloadBuildArtifacts@0
      displayName: Download WAR Artifact
      inputs:
        buildType: 'current'
        artifactName: 'java-war'
        downloadPath: '$(Pipeline.Workspace)'

    # 🔹 2️⃣ Copy WAR to VM
    - task: CopyFilesOverSSH@0
      displayName: Copy WAR to VM
      inputs:
        sshEndpoint: 'vm-ssh-connection'
        sourceFolder: '$(Pipeline.Workspace)/java-war'
        contents: '*.war'
        targetFolder: '/home/surendraadmin'

    # 🔹 3️⃣ Deploy WAR + Restart Tomcat
    - task: SSH@0
      displayName: Deploy & Restart Tomcat
      inputs:
        sshEndpoint: 'vm-ssh-connection'
        runOptions: 'inline'
        commands: |
          sudo cp /home/surendraadmin/*.war /opt/tomcat/webapps/JavaLoginShowcase.war
          sudo /opt/tomcat/bin/shutdown.sh || true
          sudo /opt/tomcat/bin/startup.sh
