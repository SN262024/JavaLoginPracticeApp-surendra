trigger:
- main

pool:
  name: Default  # Tumhara self-hosted agent pool

variables:
  VM_USER: "surendraadmin"
  TOMCAT_PATH: "/opt/tomcat"
  JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"  # Java 17 path on VM
  
stages:
- stage: Build
  displayName: Build Java Application
  jobs:
  - job: BuildJob
    displayName: Maven Build
    pool:
      name: Default
    steps:

    # 1️⃣ Checkout code
    - checkout: self

    # 2️⃣ Install Java 17 if missing & set JAVA_HOME
    - script: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        java -version
        javac -version
      displayName: Install Java 17 & Set JAVA_HOME

    # 3️⃣ Maven install
    - script: |
        sudo apt install -y maven
        mvn -version
      displayName: Install Maven

    # 4️⃣ Build WAR
    - script: |
        mvn clean package
      displayName: Maven Build

    # 5️⃣ Publish WAR Artifact
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'target'
        artifactName: 'java-war'
        publishLocation: 'Container'
      displayName: Publish WAR Artifact


# =========================
# STAGE 2 : DEPLOY
# =========================
- stage: Deploy
  displayName: Deploy to VM
  dependsOn: Build
  jobs:
  - job: DeployJob
    displayName: Deploy WAR to Tomcat
    steps:

    # 6️⃣ Download Artifact
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        artifactName: 'java-war'
        downloadPath: '$(Pipeline.Workspace)'
      displayName: Download WAR Artifact

    # 7️⃣ Copy WAR to VM
    - task: CopyFilesOverSSH@0
      inputs:
        sshEndpoint: 'vm-ssh-connection'  # Make sure your service connection exists and authorized
        sourceFolder: '$(Pipeline.Workspace)/java-war'
        contents: '*.war'
        targetFolder: '/home/$(VM_USER)'
      displayName: Copy WAR to VM

    # 8️⃣ Deploy + Restart Tomcat
    - task: SSH@0
      inputs:
        sshEndpoint: 'vm-ssh-connection'
        runOptions: 'commands'
        commands: |
          sudo cp /home/$(VM_USER)/*.war $(TOMCAT_PATH)/webapps/JavaLoginShowcase.war
          sudo $(TOMCAT_PATH)/bin/shutdown.sh || true
          sudo $(TOMCAT_PATH)/bin/startup.sh
      displayName: Restart Tomcat
