trigger:
- main

pool:
  name: Default   # your self-hosted agent pool

variables:
  TOMCAT_PATH: "/opt/tomcat"
  APP_NAME: "JavaLoginShowcase"

stages:

# =========================
# STAGE 1 : BUILD
# =========================
- stage: Build
  displayName: Build Java App
  jobs:
  - job: BuildJob
    displayName: Maven Build
    steps:

    - checkout: self

    # Install Java 17 properly
    - script: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" | sudo tee /etc/profile.d/java.sh
        source /etc/profile.d/java.sh
        java -version
      displayName: Install Java 17

    # Maven already installed but ensure JAVA_HOME
    - script: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        mvn -version
        mvn clean package
      displayName: Maven Build

    # Publish WAR
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: 'target'
        artifactName: 'java-war'
        publishLocation: 'Container'


# =========================
# STAGE 2 : DEPLOY
# =========================
- stage: Deploy
  displayName: Deploy to Tomcat
  dependsOn: Build
  jobs:
  - job: DeployJob
    displayName: Deploy WAR Locally
    steps:

    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        artifactName: 'java-war'
        downloadPath: '$(Pipeline.Workspace)'

    - script: |
        echo "Stopping Tomcat"
        sudo $(TOMCAT_PATH)/bin/shutdown.sh || true
        sleep 5

        echo "Deploying WAR"
        sudo cp $(Pipeline.Workspace)/java-war/*.war \
          $(TOMCAT_PATH)/webapps/$(APP_NAME).war

        echo "Starting Tomcat"
        sudo $(TOMCAT_PATH)/bin/startup.sh
      displayName: Deploy & Restart Tomcat
